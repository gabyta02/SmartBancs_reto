services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbanks_database

    restart: unless-stopped

    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_lock_waits=on
      -c deadlock_timeout=200ms
      -c log_min_duration_statement=250ms
      -c log_line_prefix='%m [%p] app=%a db=%d user=%u '
      -c max_connections=200


    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}


    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./base_datos/init_user.sh:/docker-entrypoint-initdb.d/01_init_user.sh:ro
      - ./base_datos/ddl.sql:/docker-entrypoint-initdb.d/02_ddl.sql:ro
      - ./base_datos/dml.sql:/docker-entrypoint-initdb.d/03_dml.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - smartbanks_network

  servicio_transacciones:
    build:
      context: .
      dockerfile: servicio_transacciones/Dockerfile

    container_name: smartbanks_transactions

    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 0
      DB_POOL_MIN_CONN: 15
      DB_POOL_TIMEOUT_S: 0.05
      ANYIO_THREAD_TOKENS: ${ANYIO_THREAD_TOKENS:-40}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-5}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      
    networks:
      - smartbanks_network

  servicio_bancs:
    build:
      context: .
      dockerfile: servicio_bancs/Dockerfile
    container_name: servicio_bancs
    ports:
      - "8001:8001"

  worker_outbox:
    build:
      context: .
      dockerfile: worker_outbox/Dockerfile

    container_name: worker_outbox

    environment:
      METRICS_PORT: 9101
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      BANCS_URL: http://servicio_bancs:8001
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE_IA: ${RABBITMQ_QUEUE_IA}

    depends_on:
      - postgres
      - servicio_bancs
      - rabbitmq

    networks:
      - smartbanks_network

  servicio_ia:
    build:
      context: .
      dockerfile: servicio_ia/Dockerfile
    container_name: servicio_ia

    ports:
      - "8002:8002"
    
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      - postgres

    networks:
      - smartbanks_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_smartbancs

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    networks:
      - smartbanks_network

  consumidor_ia:
    build:
      context: .
      dockerfile: servicio_ia/Dockerfile

    container_name: consumidor_ia

    command:
      [
        "python",
        "-u",
        "-m",
        "servicio_ia.app.consumidor"
      ]

    environment:
      METRICS_PORT: 9102
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE_IA: ${RABBITMQ_QUEUE_IA}


    depends_on:
    - rabbitmq
    - postgres

    networks:
      - smartbanks_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_smartbancs

    volumes:
      - ./monitoreo/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - servicio_transacciones

    networks:
      - smartbanks_network


  grafana:
    image: grafana/grafana:latest
    container_name: grafana_smartbancs

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

    volumes:
      - ./monitoreo/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus
    
    networks:
      - smartbanks_network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger_smartbancs

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "18086:16686"

    networks:
      - smartbanks_network

  demo_web:
    build:
      context: .
      dockerfile: demo_web/Dockerfile

    container_name: demo_web

    environment:
      URL_TRANSACCIONES: http://servicio_transacciones:8000
      URL_IA: http://servicio_ia:8002
      # Opcional: numeros de cuenta para precargar el formulario.
      DEMO_CUENTA_ORIGEN: ${DEMO_CUENTA_ORIGEN:-}
      DEMO_CUENTA_DESTINO: ${DEMO_CUENTA_DESTINO:-}

    ports:
      - "8080:8080"

    depends_on:
      - servicio_transacciones
      - servicio_ia

    networks:
      - smartbanks_network

volumes:
  postgres_data:
  grafana_data:

networks:
  smartbanks_network:
    driver: bridge
